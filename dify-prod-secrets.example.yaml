# Template for dify-prod-secrets.yaml (gitignored). Copy, fill, and pass as the
# SECOND -f file:  helm upgrade dify ./charts/dify -n trendgpt-dify \
#                    -f dify-prod-values.yaml -f dify-prod-secrets.yaml
# Rebuild it from the cluster with `helm get values dify -n trendgpt-dify` if lost.

weaviate:
  authentication:
    apikey:
      # Dify connects to Weaviate with the FIRST key; the second is the team read-only key.
      allowed_keys: ["<dify-admin-key>", "<team-read-only-key>"]
      users: ["<dify-admin-user>", "<team-read-only-user>"]
  authorization:
    admin_list:
      users: ["<dify-admin-user>"]
      read_only_users: ["<team-read-only-user>"]
  env:
    # Must mirror the lists above, comma-separated.
    AUTHENTICATION_APIKEY_ALLOWED_KEYS: "<dify-admin-key>,<team-read-only-key>"
    AUTHENTICATION_APIKEY_USERS: "<dify-admin-user>,<team-read-only-user>"
    AUTHORIZATION_ADMINLIST_USERS: "<dify-admin-user>"
    AUTHORIZATION_ADMINLIST_READONLY_USERS: "<team-read-only-user>"

# NOT YET SET — prod still runs the chart defaults from charts/dify/values.yaml for
