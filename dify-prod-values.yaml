# Dify Production Environment Values — release `dify`, namespace `trendgpt-dify` (RDSec PSC-PROD)
#
# THIS FILE IS THE SOURCE OF TRUTH FOR PROD DIFY. Every Dify change (image, env,
# resources, probes, PVC sizes, Postgres config) is made here and applied with:
#
#   helm upgrade dify ./charts/dify -n trendgpt-dify \
#     -f dify-prod-values.yaml -f dify-prod-secrets.yaml
#
# Secrets live ONLY in dify-prod-secrets.yaml (gitignored; template:
# dify-prod-secrets.example.yaml). This repo is public — never commit a secret here.
# Never use `kubectl set env` / `kubectl patch` / `kubectl set image` on this
# namespace without mirroring the change here in the same session.
# Last reconciled with the live cluster: 2026-09-27 (see README "Prod source of truth").

# Image versions (using stable hotfix versions)
image:
  api:
    # ProductIQ-patched dify-api (patches 1-5), built from TrendDifyFrontend
    # `dify-patches/` (see its README). The worker uses the same image. JFrog pulls
    # use `jfrog-docker-secret` on the namespace's default ServiceAccount.
    repository: jfrog.trendmicro.com/aatf-docker-prod-local/productiq-dify-api
    tag: "1.8.1-piq.4"
  web:
    repository: langgenius/dify-web
    tag: "1.8.1"
  sandbox:
    repository: langgenius/dify-sandbox
    tag: "0.2.12"
  pluginDaemon:
    repository: langgenius/dify-plugin-daemon
    tag: "0.2.0-local"

# API configuration
api:
  # 2 replicas for HA; pod affinity keeps them co-located for shared RWO PVC
  replicas: 2
  affinity:
    podAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: component
                  operator: In
                  values:
                    - api
            topologyKey: kubernetes.io/hostname
  # Environment variables - Updated for internal ingress access
  extraEnv:
    - name: CONSOLE_WEB_URL
      value: "https://trendgptdify.runtime.trendmicro.com"
    - name: CONSOLE_API_URL
      value: "https://trendgptdify.runtime.trendmicro.com"
    - name: SERVICE_API_URL
      value: "https://trendgptdify.runtime.trendmicro.com"
    - name: APP_WEB_URL
      value: "https://trendgptdify.runtime.trendmicro.com"
    - name: FILES_URL
      value: "https://trendgptdify.runtime.trendmicro.com"
    - name: LITELLM_MODIFY_PARAMS
      value: "true"
    # Resilience: 4 workers so slow LLM calls don't starve health probes
    - name: SERVER_WORKER_AMOUNT
      value: "4"
    - name: GUNICORN_TIMEOUT
      value: "600"
    # Cap pool so 4 workers × (10 + 5) = 60 conns fits well under Postgres max_connections
    - name: SQLALCHEMY_POOL_SIZE
      value: "10"
    - name: SQLALCHEMY_MAX_OVERFLOW
      value: "5"
    # Drop dead sockets left over from OOMKilled pods
    - name: SQLALCHEMY_POOL_PRE_PING
      value: "true"
    - name: SQLALCHEMY_POOL_RECYCLE
      value: "1800"
    # ProductIQ patch 5: label header-less KB search results with their source
    # document for the model (off | on | comma-separated app ids). Keep equal on worker.
    - name: PIQ_DATASET_SOURCE_LABELS
      value: "on"
  # Resources for 4 gevent workers — raised to stop OOMKill loop under plugin+embedding load
  resources:
    requests:
      cpu: '500m'
      memory: '2Gi'
    limits:
      cpu: '2'
      memory: '8Gi'
  # Relaxed probes: slow upstream LLM endpoints shouldn't crash-loop the API
  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 15
    failureThreshold: 10
    successThreshold: 1
  readinessProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 10
    successThreshold: 1
  # Persistence configuration. The `dify` PVC was expanded online to 64Gi; PVCs cannot
  # shrink, so this must stay >= the live capacity.
  persistence:
    persistentVolumeClaim:
      accessModes: ReadWriteOnce
      size: 64Gi

# Worker configuration
worker:
  # 2 replicas, 4 gevent greenlets each → 8x ingestion concurrency vs prior 1x
  replicas: 2
  extraEnv:
    - name: LITELLM_MODIFY_PARAMS
      value: "true"
    # 4 gevent greenlets per worker process = 4 concurrent indexing tasks per pod
    - name: CELERY_WORKER_AMOUNT
      value: "4"
    # Match api pool caps so worker doesn't exhaust max_connections during embedding bursts
    - name: SQLALCHEMY_POOL_SIZE
      value: "10"
    - name: SQLALCHEMY_MAX_OVERFLOW
      value: "5"
    - name: SQLALCHEMY_POOL_PRE_PING
      value: "true"
    - name: SQLALCHEMY_POOL_RECYCLE
      value: "1800"
    - name: PIQ_DATASET_SOURCE_LABELS
      value: "on"
  persistence:
    persistentVolumeClaim:
      accessModes: ReadWriteOnce
  # Force worker to run on same node as API for PVC sharing
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
          - key: component
            operator: In
            values:
            - api
        topologyKey: kubernetes.io/hostname

# Plugin Daemon configuration
pluginDaemon:
  # 2 replicas for HA; same-node affinity keeps them on one host for shared RWO PVC
  replicas: 2
  affinity:
    podAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: component
                  operator: In
                  values:
                    - plugin-daemon
            topologyKey: kubernetes.io/hostname
  extraEnv:
    - name: FORCE_VERIFYING_SIGNATURE
      value: "false"
  # Explicit resources — otherwise inherits namespace LimitRange (1 CPU / 2Gi), which OOMs
  resources:
    requests:
      cpu: '200m'
      memory: '1Gi'
    limits:
      cpu: '2'
      memory: '4Gi'
  persistence:
    persistentVolumeClaim:
      accessModes: ReadWriteOnce
      size: 16Gi

# PostgreSQL configuration
#
# PVC sizes: the live PVCs were expanded online to 256Gi on 2026-09-16
# (TrendDifyFrontend docs/database/DIFY_STORAGE_INCIDENT_2026-09-16.md). The live
# StatefulSets still carry their original volumeClaimTemplates (primary 64Gi, read
# 32Gi), and volumeClaimTemplates are immutable, so a `helm upgrade` with these sizes
# is REJECTED until both StatefulSets are recreated. In the maintenance window, first:
#   kubectl -n trendgpt-dify delete sts dify-postgresql-primary dify-postgresql-read --cascade=orphan
# (pods and PVCs keep running), then run the helm upgrade, which recreates them.
postgresql:
  primary:
    persistence:
      size: 256Gi
    # Headroom above default 100; a primary restart is required when this changes.
    # wal_keep_size keeps 8GB of WAL for the streaming replica (replication hardening,
    # applied live 2026-07-14; TrendDifyFrontend docs/database/DIFY_POSTGRESQL_REPLICATION.md).
    extendedConfiguration: |
      max_connections = 200
      wal_keep_size = 8192MB
  readReplicas:
    persistence:
      size: 256Gi
    extendedConfiguration: |
      max_connections = 200
    # Ready only while the replica is actually streaming from the primary (a replica
    # that lost replication keeps answering pg_isready and serves stale reads).
    customReadinessProbe:
      exec:
        command:
          - /bin/sh
          - -ec
          - >-
            test "$(PGCONNECT_TIMEOUT=3 PGPASSWORD="$POSTGRES_PASSWORD"
            /opt/bitnami/postgresql/bin/psql -w -X -A -t -v ON_ERROR_STOP=1
            -U postgres -d postgres -h 127.0.0.1
            -p "$POSTGRESQL_PORT_NUMBER"
            -c "SELECT 1 FROM pg_stat_wal_receiver WHERE status = 'streaming' LIMIT 1")" = "1"
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 5
      successThreshold: 1
      failureThreshold: 6

# Redis configuration
redis:
  master:
    persistence:
      size: 16Gi
  replica:
    persistence:
      size: 16Gi

# Weaviate configuration - FIXED FOR OOM ISSUES + READ-ONLY ACCESS
weaviate:
  # Live PVC is 128Gi; the live StatefulSet's volumeClaimTemplate still says 64Gi.
  # Same immutability rule as Postgres: `kubectl delete sts weaviate --cascade=orphan`
  # before the helm upgrade that carries this size.
  storage:
    size: 128Gi

  # Service configuration - ClusterIP for ingress access
  service:
    type: ClusterIP
    name: weaviate

  # NGINX Proxy for path rewriting (/weaviate/* -> /*)
  proxy:
    enabled: true
    replicas: 1
    resources:
      requests:
        cpu: '100m'
        memory: '128Mi'
      limits:
        cpu: '500m'
        memory: '512Mi'

  resources:
    requests:
      cpu: '4'
      memory: '16Gi'
    limits:
      cpu: '8'
      memory: '40Gi'  # Raised from 24Gi — was at 95% under 10K doc / 52K segment load

  # Authentication: API keys and the admin / read-only user lists are in
  # dify-prod-secrets.yaml (weaviate.authentication / weaviate.authorization / the
  # AUTHENTICATION_* and AUTHORIZATION_ADMINLIST_* env keys). Dify connects with the
  # FIRST allowed key.
  authentication:
    anonymous_access:
      enabled: false
    apikey:
      enabled: true
  authorization:
    admin_list:
      enabled: true

  env:
    # Enable automatic resource limiting
    LIMIT_RESOURCES: "true"
    # Set GOMEMLIMIT to 36GiB (below the 40Gi limit) — headroom for GC overhead
    GOMEMLIMIT: 36GiB
    # Reduce GC aggressiveness to allow more memory usage before triggering GC
    GOGC: 200
    # Increase query result limit if needed
    QUERY_MAXIMUM_RESULTS: 100000
    # Make vector cache prefilling asynchronous (avoid loading all at startup)
    HNSW_STARTUP_WAIT_FOR_VECTOR_CACHE: "false"
    # Authentication and Authorization for read-only access (keys and users: dify-prod-secrets.yaml)
    AUTHENTICATION_APIKEY_ENABLED: "true"
    AUTHORIZATION_ADMINLIST_ENABLED: "true"

# Proxy configuration - optimize for better performance
proxy:
  resources:
    requests:
      cpu: '500m'
      memory: '1Gi'
    limits:
      cpu: '2'
      memory: '4Gi'

# Web configuration - optimize for better performance  
web:
  resources:
    requests:
      cpu: '500m'
      memory: '1Gi'
    limits:
      cpu: '2'
      memory: '4Gi'

# Ingress configuration - Internal ALB for secure access
ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/group.name: 'rdsec.internal-services'
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/target-type: 'ip'
    alb.ingress.kubernetes.io/scheme: internal
  hosts:
    - host: "trendgptdify.runtime.trendmicro.com"
      paths:
        # Weaviate path - MUST come first for proper routing (more specific)
        # Routes to NGINX proxy which strips /weaviate prefix before forwarding to Weaviate
        - path: /weaviate
          pathType: Prefix
          backend:
            service:
              name: dify-weaviate-proxy
              port:
                number: 80
        # Dify path - catch-all route (less specific, must come last)
        - path: /
          pathType: Prefix

# Service Configuration - ClusterIP for internal ingress access
service:
  enabled: true
  name: dify
  type: ClusterIP
  port: 443

# Keep-alive CronJob to prevent nginx timeout issues
keepalive:
  enabled: true
  schedule: "* * * * *"  # Every minute
  image: curlimages/curl:latest